{{ $filename := .Get 0 }}
{{ $caption := .Get 1 }}
{{ $image := .Page.Resources.GetMatch $filename }}
{{ if $image }}
  {{ $processed := $image.Fit "1200x1200" }}
  <div class='photo-container'>
    <img src='{{ $processed.RelPermalink }}' alt='{{ $filename }}' class='photo-main'>
    {{ with $caption }}
      <p class='photo-caption'>{{ . }}</p>
    {{ end }}
  </div>
{{ end }}
